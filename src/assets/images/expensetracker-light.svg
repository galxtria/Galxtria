      <text x="654" y="408" font-size="20" font-weight="800" fill="#ffffff">—</text>
      <text x="654" y="424" font-size="9" fill="#71717a">Belum ada</text>

      <!-- recent -->
      <text x="520" y="458" font-size="13.5" font-weight="800" fill="#ffffff">Pengeluaran Terakhir</text>

      <rect x="520" y="466" width="240" height="52" rx="13" fill="#141416" stroke="#26262e"/>
      <rect x="530" y="476" width="30" height="30" rx="9" fill="rgba(47,123,255,0.15)"/>
      <g stroke="#60a5fa" stroke-width="1.7" stroke-linecap="round">
        <line x1="538" y1="483" x2="538" y2="488"/>
        <line x1="541.5" y1="483" x2="541.5" y2="497"/>
        <line x1="545" y1="483" x2="545" y2="488"/>
        <line x1="538" y1="488" x2="545" y2="488"/>
        <path d="M552,483 c4,3 4,9 0,12" fill="none"/>
        <line x1="552" y1="495" x2="552" y2="499"/>
      </g>
      <text x="566" y="488" font-size="11.5" font-weight="700" fill="#ffffff">Miedas</text>
      <text x="566" y="502" font-size="9" fill="#71717a">Makan  •  28 Aug, 17:46</text>
      <text x="748" y="494" text-anchor="end" font-size="12.5" font-weight="800" fill="#f87171">-Rp 28.000</text>

      <rect x="520" y="524" width="240" height="52" rx="13" fill="#141416" stroke="#26262e"/>
      <rect x="530" y="534" width="30" height="30" rx="9" fill="rgba(47,123,255,0.15)"/>
      <g stroke="#60a5fa" stroke-width="1.7" stroke-linecap="round">
        <line x1="538" y1="541" x2="538" y2="546"/>
        <line x1="541.5" y1="541" x2="541.5" y2="555"/>
        <line x1="545" y1="541" x2="545" y2="546"/>
        <line x1="538" y1="546" x2="545" y2="546"/>
        <path d="M552,541 c4,3 4,9 0,12" fill="none"/>
        <line x1="552" y1="553" x2="552" y2="557"/>
      </g>
      <text x="566" y="546" font-size="11.5" font-weight="700" fill="#ffffff">Circle K</text>
      <text x="566" y="560" font-size="9" fill="#71717a">Makan  •  28 Aug, 17:20</text>
      <text x="748" y="552" text-anchor="end" font-size="12.5" font-weight="800" fill="#f87171">-Rp 30.000</text>

      <!-- bottom nav -->
      <rect x="532" y="584" width="216" height="40" rx="20" fill="#101014" stroke="#26262e"/>
      <rect x="538" y="589" width="98" height="30" rx="15" fill="#2f7bff"/>
      <rect x="549" y="596" width="6" height="6" rx="2" fill="#ffffff"/>
      <rect x="557" y="596" width="6" height="6" rx="2" fill="#ffffff"/>
      <rect x="549" y="604" width="6" height="6" rx="2" fill="#ffffff"/>
      <rect x="557" y="604" width="6" height="6" rx="2" fill="#ffffff"/>
      <text x="568" y="609" font-size="11.5" font-weight="700" fill="#ffffff">Home</text>
      <circle cx="660" cy="604" r="10" fill="none" stroke="#55555e" stroke-width="1.8"/>
      <line x1="655" y1="604" x2="665" y2="604" stroke="#55555e" stroke-width="1.8"/>
      <line x1="660" y1="599" x2="660" y2="609" stroke="#55555e" stroke-width="1.8"/>
      <rect x="696" y="596" width="13" height="17" rx="2" fill="none" stroke="#55555e" stroke-width="1.8"/>
      <circle cx="732" cy="604" r="9" fill="none" stroke="#55555e" stroke-width="1.8"/>
      <line x1="732" y1="604" x2="732" y2="595" stroke="#55555e" stroke-width="1.8"/>
      <line x1="732" y1="604" x2="739" y2="611" stroke="#55555e" stroke-width="1.8"/>

      <!-- screen glare -->
      <polygon points="508,110 616,110 536,630 508,630" fill="url(#ex-glare)"/>
    </g>
  </g>

  <!-- floating transaction badge -->
  <g filter="url(#ex-soft)">
    <rect x="282" y="300" width="176" height="64" rx="12" fill="#ffffff" stroke="#fecaca"/>
    <text x="300" y="324" font-size="9" fill="#64748b">MAKAN • 28 AUG</text>
    <text x="300" y="346" font-size="13" font-weight="800" fill="#dc2626">-Rp 28.000</text>
  </g>

  <!-- floating budget badge -->
  <g filter="url(#ex-soft)">
    <rect x="822" y="520" width="176" height="64" rx="12" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="840" y="547" font-size="15" font-weight="800" fill="#1d4ed8">Rp 1.5jt</text>
    <text x="840" y="564" font-size="9" fill="#64748b">monthly budget</text>
  </g>

  <g font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="2">
    <text x="300" y="700"><tspan font-weight="800" fill="#2563eb">01 </tspan><tspan fill="#64748b">EXPENSE OVERVIEW</tspan></text>
    <text x="560" y="700"><tspan font-weight="800" fill="#2563eb">02 </tspan><tspan fill="#64748b">MONTHLY BUDGET</tspan></text>
    <text x="810" y="700"><tspan font-weight="800" fill="#2563eb">03 </tspan><tspan fill="#64748b">TRANSACTIONS</tspan></text>
  </g>
</svg>
