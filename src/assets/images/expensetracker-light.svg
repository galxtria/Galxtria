<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="ex-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#f4f6fd"/>
      <stop offset="1" stop-color="#e3e9f8"/>
    </linearGradient>
    <radialGradient id="ex-glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#3b82f6" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ex-glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.2"/>
      <stop offset="0.6" stop-color="#22d3ee" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ex-brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0284c7"/>
      <stop offset="0.55" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="ex-laser" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="0.28" stop-color="#3b82f6" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#7dd3fc" stop-opacity="0.55"/>
      <stop offset="0.8" stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ex-frame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#d7dee9"/>
      <stop offset="1" stop-color="#f4f7fb"/>
    </linearGradient>
    <linearGradient id="ex-glare" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.015"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="ex-grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#4d5f8a" opacity="0.14"/>
    </pattern>
    <clipPath id="ex-screen">
      <rect x="508" y="110" width="264" height="520" rx="32"/>
    </clipPath>
    <filter id="ex-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="22" stdDeviation="30" flood-color="#1d4ed8" flood-opacity="0.22"/>
    </filter>
    <filter id="ex-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#1d4ed8" flood-opacity="0.2"/>
    </filter>
    <filter id="ex-blur18" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#ex-bg)"/>
  <rect width="1280" height="720" fill="url(#ex-grid)"/>
  <ellipse cx="230" cy="180" rx="330" ry="230" fill="url(#ex-glowB)"/>
  <ellipse cx="1090" cy="620" rx="360" ry="240" fill="url(#ex-glowC)"/>

  <rect x="0" y="438" width="1280" height="2.5" fill="url(#ex-laser)" opacity="0.7"/>
  <rect x="0" y="441" width="1280" height="12" fill="url(#ex-laser)" opacity="0.12" filter="url(#ex-blur18)"/>

  <text x="70" y="122" font-size="58" font-weight="900" letter-spacing="-1">
    <tspan fill="#1e1b2e">Expense</tspan><tspan fill="url(#ex-brand)">Tracker</tspan>
  </text>
  <text x="72" y="154" font-size="19" font-weight="500" fill="#64748b">Automated Financial Management App</text>

  <g font-size="11" font-weight="600" fill="#475569">
    <rect x="70" y="172" width="100" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="88" cy="185" r="4" fill="#0284c7"/>
    <text x="98" y="189">Flutter</text>
    <rect x="178" y="172" width="86" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="196" cy="185" r="4" fill="#00b4d8"/>
    <text x="206" y="189">Dart</text>
    <rect x="272" y="172" width="102" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="290" cy="185" r="4" fill="#f59e0b"/>
    <text x="300" y="189">Firebase</text>
  </g>

  <rect x="1084" y="64" width="126" height="38" rx="19" fill="#dbeafe" stroke="#3b82f6" stroke-opacity="0.55"/>
  <text x="1147" y="89" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="2" fill="#1d4ed8">MOBILE APP</text>

  <ellipse cx="640" cy="658" rx="210" ry="11" fill="#1d4ed8" opacity="0.12" filter="url(#ex-blur18)"/>

  <!-- phone device -->
  <g filter="url(#ex-shadow)">
    <!-- side buttons -->
    <rect x="490" y="168" width="5" height="18" rx="2.5" fill="#c3ccd8"/>
    <rect x="490" y="198" width="5" height="32" rx="2.5" fill="#c3ccd8"/>
    <rect x="490" y="236" width="5" height="32" rx="2.5" fill="#c3ccd8"/>
    <rect x="781" y="208" width="5" height="44" rx="2.5" fill="#c3ccd8"/>
    <!-- light frame + black bezel + screen -->
    <rect x="494" y="96" width="292" height="548" rx="46" fill="url(#ex-frame)" stroke="#d5dce6"/>
    <rect x="502" y="104" width="276" height="532" rx="38" fill="#000000"/>
    <rect x="508" y="110" width="264" height="520" rx="32" fill="#0a0a0c"/>

    <g clip-path="url(#ex-screen)">
      <!-- status bar -->
      <text x="522" y="134" font-size="11" font-weight="700" fill="#ffffff">18.17</text>
      <rect x="722" y="124" width="3" height="6" rx="1" fill="#ffffff" opacity="0.9"/>
      <rect x="727" y="122" width="3" height="8" rx="1" fill="#ffffff" opacity="0.9"/>
      <rect x="732" y="120" width="3" height="10" rx="1" fill="#ffffff" opacity="0.9"/>
      <rect x="740" y="122" width="24" height="12" rx="6" fill="none" stroke="#ffffff" stroke-opacity="0.5"/>
      <rect x="742" y="124" width="15" height="8" rx="4" fill="#ffffff" opacity="0.9"/>

      <!-- header -->
      <text x="520" y="164" font-size="23" font-weight="900" fill="#ffffff">Expense Tracker</text>
      <text x="520" y="180" font-size="10" fill="#8a8a95">Wednesday, 16 September 2026</text>
      <rect x="730" y="142" width="34" height="34" rx="11" fill="#141416" stroke="#2a2a32"/>
      <line x1="740" y1="153" x2="754" y2="153" stroke="#71717a" stroke-width="1.6"/>
      <line x1="740" y1="159" x2="754" y2="159" stroke="#71717a" stroke-width="1.6"/>
      <line x1="740" y1="165" x2="754" y2="165" stroke="#71717a" stroke-width="1.6"/>
      <circle cx="750" cy="153" r="2" fill="#a1a1aa"/>
      <circle cx="744" cy="159" r="2" fill="#a1a1aa"/>
      <circle cx="749" cy="165" r="2" fill="#a1a1aa"/>

      <!-- total card -->
      <rect x="520" y="190" width="240" height="102" rx="17" fill="#141416" stroke="#26262e"/>
      <circle cx="588" cy="212" r="4" fill="#2f7bff"/>
      <text x="598" y="216" font-size="11.5" fill="#c9c9d2">Total Pengeluaran</text>
      <text x="640" y="252" text-anchor="middle" font-size="38" font-weight="900" fill="#ffffff">Rp 0</text>
      <rect x="580" y="260" width="120" height="20" rx="10" fill="#1e1e24"/>
      <text x="640" y="274" text-anchor="middle" font-size="9.5" fill="#71717a">September 2026</text>

      <!-- budget row -->
      <rect x="520" y="298" width="240" height="58" rx="13" fill="#141416" stroke="#26262e"/>
      <path d="M532,312 h9 v9 h-9 z M532,312 l9,2.5 -9,2.5 z" fill="#2f7bff"/>
      <text x="548" y="321" font-size="11" font-weight="600" fill="#d7d7de">Batas Bulanan</text>
      <text x="748" y="321" text-anchor="end" font-size="9.5" fill="#71717a">Rp 0 / Rp 1.500.000</text>
      <rect x="532" y="331" width="216" height="5" rx="2.5" fill="#26262e"/>
      <rect x="532" y="331" width="65" height="5" rx="2.5" fill="#2f7bff"/>

      <!-- mini cards -->
      <rect x="520" y="362" width="116" height="80" rx="14" fill="#141416" stroke="#26262e"/>
      <rect x="532" y="373" width="13" height="13" rx="4" fill="none" stroke="#2f7bff" stroke-width="1.6"/>
      <text x="549" y="384" font-size="9.5" fill="#8a8a95">Bulan Ini</text>
      <text x="532" y="408" font-size="20" font-weight="800" fill="#ffffff">0</text>
      <text x="532" y="424" font-size="9" fill="#71717a">transaksi</text>
      <rect x="642" y="362" width="118" height="80" rx="14" fill="#141416" stroke="#26262e"/>
      <circle cx="657" cy="377" r="2.8" fill="#2f7bff"/>
      <circle cx="663" cy="377" r="2.8" fill="#2f7bff" opacity="0.6"/>
      <circle cx="660" cy="371" r="2.8" fill="#2f7bff" opacity="0.8"/>
