      <text x="748" y="239" text-anchor="end" font-size="8.5" font-weight="700" fill="#0f766e">View All</text>

      <!-- featured card -->
      <rect x="516" y="248" width="240" height="216" rx="15" fill="#ffffff" stroke="#e8eaee"/>
      <path d="M516,248 h210 a14,14 0 0 1 14,14 v92 h-238 v-92 a14,14 0 0 1 14,-14 z" fill="url(#ka-room)"/>
      <rect x="596" y="260" width="66" height="72" rx="3" fill="#e6f3f0" opacity="0.9"/>
      <line x1="629" y1="260" x2="629" y2="332" stroke="#0a3d39" stroke-width="2" opacity="0.6"/>
      <line x1="596" y1="296" x2="662" y2="296" stroke="#0a3d39" stroke-width="2" opacity="0.6"/>
      <rect x="582" y="260" width="11" height="72" fill="#083f3a" opacity="0.85"/>
      <rect x="560" y="324" width="130" height="22" rx="9" fill="#0e4f4a"/>
      <rect x="570" y="316" width="30" height="12" rx="4" fill="#0e4f4a" opacity="0.7"/>
      <rect x="528" y="332" width="112" height="17" rx="8.5" fill="#0f766e"/>
      <text x="584" y="344" text-anchor="middle" font-size="7" font-weight="800" letter-spacing="1" fill="#ffffff">FEATURED PROPERTY</text>
