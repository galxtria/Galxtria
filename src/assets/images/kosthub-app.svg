      <text x="715" y="270" text-anchor="middle" font-size="9.5" font-weight="800" fill="#12312e">★ 4.9</text>
      <text x="528" y="374" font-size="12.5" font-weight="800" fill="#12312e">Kos Harmoni Tipe A</text>
      <text x="748" y="368" text-anchor="end" font-size="11" font-weight="800" fill="#12312e">Rp</text>
      <text x="748" y="382" text-anchor="end" font-size="11" font-weight="800" fill="#12312e">3.5jt</text>
      <text x="748" y="392" text-anchor="end" font-size="6.5" fill="#8a8a95">/ MONTH</text>
      <circle cx="532" cy="388" r="2.8" fill="none" stroke="#8a8a95" stroke-width="1.2"/>
      <text x="540" y="392" font-size="8.5" fill="#6b7280">Kebayoran Baru, Jakarta</text>
      <text x="540" y="403" font-size="8.5" fill="#6b7280">Selatan</text>
      <g font-size="7" fill="#4b5563">
        <circle cx="538" cy="422" r="9" fill="rgba(15,118,110,0.12)"/>
        <path d="M534,422 a4,4 0 0 1 8,0 M534,422 a7,7 0 0 1 8,0" stroke="#0f766e" stroke-width="1.2" fill="none"/>
        <text x="553" y="419">Fast</text>
        <text x="553" y="428">WiFi</text>
        <circle cx="602" cy="422" r="9" fill="rgba(15,118,110,0.12)"/>
        <line x1="602" y1="415" x2="602" y2="429" stroke="#0f766e" stroke-width="1.2"/>
        <line x1="597" y1="418" x2="607" y2="426" stroke="#0f766e" stroke-width="1.2"/>
        <line x1="607" y1="418" x2="597" y2="426" stroke="#0f766e" stroke-width="1.2"/>
        <text x="617" y="419">Full</text>
        <text x="617" y="428">AC</text>
        <circle cx="666" cy="422" r="9" fill="rgba(15,118,110,0.12)"/>
        <rect x="661" y="417" width="10" height="10" rx="2" fill="none" stroke="#0f766e" stroke-width="1.2"/>
        <text x="681" y="419">Private</text>
        <text x="681" y="428">Bath</text>
      </g>

      <!-- sekitar anda -->
      <text x="516" y="486" font-size="14" font-weight="800" fill="#12312e">Sekitar Anda</text>
      <text x="748" y="485" text-anchor="end" font-size="8.5" font-weight="700" fill="#0f766e">See Nearby</text>
      <rect x="516" y="494" width="240" height="66" rx="13" fill="#ffffff" stroke="#e8eaee"/>
      <rect x="526" y="502" width="56" height="50" rx="9" fill="url(#ka-roomB)"/>
      <rect x="536" y="510" width="26" height="28" rx="2" fill="#ffffff" opacity="0.6"/>
      <rect x="542" y="532" width="26" height="9" rx="3" fill="#8a7a5a" opacity="0.6"/>
      <text x="592" y="518" font-size="11.5" font-weight="800" fill="#12312e">Kos Permata</text>
      <text x="592" y="531" font-size="8.5" fill="#6b7280">800m from your</text>
      <text x="592" y="543" font-size="8.5" fill="#6b7280">location</text>
      <text x="592" y="554" font-size="7.5" fill="#8a8a95">1 bed  •  1 bath</text>
      <text x="746" y="520" text-anchor="end" font-size="11" font-weight="800" fill="#12312e">Rp 2.1jt</text>
      <text x="746" y="532" text-anchor="end" font-size="7.5" fill="#8a8a95">/ mo</text>

      <!-- bottom nav -->
      <rect x="512" y="586" width="252" height="40" rx="18" fill="#ffffff" stroke="#e5e7eb"/>
      <path d="M546,596 l10,-9 10,9 v10 h-6 v-5 h-8 v5 h-6 z" fill="#0f766e"/>
      <text x="556" y="619" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0f766e">Home</text>
      <path d="M604,594 h12 v18 l-6,-4.5 -6,4.5 z" fill="none" stroke="#b6bcc6" stroke-width="1.8"/>
      <rect x="652" y="594" width="16" height="13" rx="6" fill="none" stroke="#b6bcc6" stroke-width="1.8"/>
      <circle cx="708" cy="600" r="5" fill="none" stroke="#b6bcc6" stroke-width="1.8"/>
      <path d="M699,616 a12,7 0 0 1 18,0" fill="none" stroke="#b6bcc6" stroke-width="1.8"/>

      <!-- screen glare -->
      <polygon points="508,110 616,110 536,630 508,630" fill="url(#ka-glare)"/>
    </g>
  </g>

  <!-- floating rating badge -->
  <g filter="url(#ka-soft)">
    <rect x="282" y="300" width="176" height="64" rx="12" fill="rgba(16,16,24,0.9)" stroke="rgba(45,212,191,0.45)"/>
    <text x="300" y="328" font-size="15" font-weight="800" fill="#fbbf24">★ 4.9</text>
    <text x="300" y="346" font-size="9" fill="#8a8a95">Featured Property</text>
  </g>

  <!-- floating price badge -->
  <g filter="url(#ka-soft)">
    <rect x="822" y="520" width="176" height="64" rx="12" fill="rgba(16,16,24,0.9)" stroke="rgba(168,85,247,0.45)"/>
    <text x="840" y="547" font-size="15" font-weight="800" fill="#5eead4">Rp 3.5jt</text>
    <text x="840" y="564" font-size="9" fill="#8a8a95">/ month • Harmoni</text>
  </g>

  <g font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="2">
    <text x="300" y="700"><tspan font-weight="800" fill="#2dd4bf">01 </tspan><tspan fill="#71717a">RECOMMENDATIONS</tspan></text>
    <text x="570" y="700"><tspan font-weight="800" fill="#2dd4bf">02 </tspan><tspan fill="#71717a">NEARBY STAYS</tspan></text>
    <text x="800" y="700"><tspan font-weight="800" fill="#2dd4bf">03 </tspan><tspan fill="#71717a">EASY BOOKING</tspan></text>
  </g>
</svg>
