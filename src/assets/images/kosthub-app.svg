<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="ka-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a13"/>
      <stop offset="1" stop-color="#060609"/>
    </linearGradient>
    <radialGradient id="ka-glowP" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#7c3aed" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ka-glowT" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#14b8a6" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ka-brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8b4fe"/>
      <stop offset="0.55" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="ka-laser" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0"/>
      <stop offset="0.28" stop-color="#14b8a6" stop-opacity="0.7"/>
      <stop offset="0.55" stop-color="#a855f7" stop-opacity="0.9"/>
      <stop offset="0.8" stop-color="#14b8a6" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ka-frame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a4a55"/>
      <stop offset="0.5" stop-color="#17171e"/>
      <stop offset="1" stop-color="#3a3a45"/>
    </linearGradient>
    <linearGradient id="ka-glare" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.015"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ka-room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14958a"/>
      <stop offset="1" stop-color="#0a3d39"/>
    </linearGradient>
    <linearGradient id="ka-roomB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3ede2"/>
      <stop offset="1" stop-color="#c9bda6"/>
    </linearGradient>
    <linearGradient id="ka-avatar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9a8d4"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <pattern id="ka-grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <clipPath id="ka-screen">
      <rect x="508" y="110" width="264" height="520" rx="32"/>
    </clipPath>
    <filter id="ka-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="26" stdDeviation="34" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="ka-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#14b8a6" flood-opacity="0.4"/>
    </filter>
    <filter id="ka-blur18" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#ka-bg)"/>
  <rect width="1280" height="720" fill="url(#ka-grid)"/>
  <ellipse cx="230" cy="180" rx="330" ry="230" fill="url(#ka-glowP)"/>
  <ellipse cx="1090" cy="620" rx="360" ry="240" fill="url(#ka-glowT)"/>

  <rect x="0" y="438" width="1280" height="3" fill="url(#ka-laser)" opacity="0.8"/>
  <rect x="0" y="441" width="1280" height="12" fill="url(#ka-laser)" opacity="0.18" filter="url(#ka-blur18)"/>

  <text x="70" y="122" font-size="58" font-weight="900" letter-spacing="-1">
    <tspan fill="#ffffff">Kost</tspan><tspan fill="url(#ka-brand)">Hub App</tspan>
  </text>
  <text x="72" y="154" font-size="19" font-weight="500" fill="#9c9cae">Boarding House Management App</text>

  <g font-size="11" font-weight="600" fill="#d4d4d8">
    <rect x="70" y="172" width="92" height="26" rx="13" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.14)"/>
    <circle cx="88" cy="185" r="4" fill="#f59e0b"/>
    <text x="98" y="189">Java</text>
    <rect x="170" y="172" width="100" height="26" rx="13" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.14)"/>
    <circle cx="188" cy="185" r="4" fill="#3ddc84"/>
    <text x="198" y="189">Android</text>
    <rect x="278" y="172" width="102" height="26" rx="13" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.14)"/>
    <circle cx="296" cy="185" r="4" fill="#ffca28"/>
    <text x="306" y="189">Firebase</text>
  </g>

  <rect x="1084" y="64" width="126" height="38" rx="19" fill="rgba(20,184,166,0.12)" stroke="#14b8a6" stroke-opacity="0.6"/>
  <text x="1147" y="89" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="2" fill="#5eead4">MOBILE APP</text>

  <ellipse cx="640" cy="658" rx="210" ry="11" fill="#000000" opacity="0.55" filter="url(#ka-blur18)"/>
  <ellipse cx="640" cy="654" rx="150" ry="8" fill="#14b8a6" opacity="0.22" filter="url(#ka-blur18)"/>

  <!-- phone device -->
  <g filter="url(#ka-shadow)">
    <!-- side buttons -->
    <rect x="490" y="168" width="5" height="18" rx="2.5" fill="#3f3f4a"/>
    <rect x="490" y="198" width="5" height="32" rx="2.5" fill="#3f3f4a"/>
    <rect x="490" y="236" width="5" height="32" rx="2.5" fill="#3f3f4a"/>
    <rect x="781" y="208" width="5" height="44" rx="2.5" fill="#3f3f4a"/>
    <!-- titanium frame + black bezel + screen -->
    <rect x="494" y="96" width="292" height="548" rx="46" fill="url(#ka-frame)" stroke="rgba(255,255,255,0.2)"/>
    <rect x="502" y="104" width="276" height="532" rx="38" fill="#000000"/>
    <rect x="508" y="110" width="264" height="520" rx="32" fill="#f6f7f9"/>

    <g clip-path="url(#ka-screen)">
      <!-- status bar -->
      <text x="522" y="134" font-size="11" font-weight="700" fill="#0f172a">9:41</text>
      <rect x="600" y="118" width="88" height="22" rx="11" fill="#0f172a"/>
      <rect x="722" y="124" width="3" height="6" rx="1" fill="#0f172a"/>
      <rect x="727" y="122" width="3" height="8" rx="1" fill="#0f172a"/>
      <rect x="732" y="120" width="3" height="10" rx="1" fill="#0f172a"/>
      <rect x="740" y="122" width="24" height="12" rx="6" fill="none" stroke="#0f172a" stroke-opacity="0.5"/>
      <rect x="742" y="124" width="15" height="8" rx="4" fill="#0f172a"/>

      <!-- profile header -->
      <circle cx="534" cy="160" r="15" fill="url(#ka-avatar)"/>
      <text x="556" y="156" font-size="9.5" fill="#8a8a95">Good Morning</text>
      <text x="556" y="172" font-size="12.5" font-weight="800" fill="#12312e">Huh Yunjin</text>
      <circle cx="744" cy="160" r="14" fill="#ffffff" stroke="#e5e7eb"/>
      <path d="M739,160 a5,5 0 0 1 10,0 v3 h-10 z M742.5,165 a1.6,1.6 0 0 0 3,0" fill="none" stroke="#12312e" stroke-width="1.6"/>
      <circle cx="752" cy="151" r="2.8" fill="#f43f5e"/>

      <!-- search -->
      <rect x="516" y="184" width="196" height="34" rx="11" fill="#e9edf2"/>
      <circle cx="534" cy="201" r="5" fill="none" stroke="#8a8a95" stroke-width="1.6"/>
      <circle cx="534" cy="201" r="1.4" fill="#8a8a95"/>
      <text x="546" y="205" font-size="10" fill="#9aa0aa">Find a place to stay...</text>
      <rect x="718" y="184" width="38" height="34" rx="10" fill="#0f766e"/>
      <line x1="728" y1="194" x2="748" y2="194" stroke="#ffffff" stroke-width="1.6"/>
      <line x1="728" y1="201" x2="748" y2="201" stroke="#ffffff" stroke-width="1.6"/>
      <line x1="728" y1="208" x2="748" y2="208" stroke="#ffffff" stroke-width="1.6"/>

      <!-- rekomendasi -->
