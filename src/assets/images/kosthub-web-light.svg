  <rect width="1280" height="720" fill="url(#kh-bg)"/>
  <rect width="1280" height="720" fill="url(#kh-grid)"/>
  <ellipse cx="240" cy="180" rx="330" ry="230" fill="url(#kh-glowP)"/>
  <ellipse cx="1080" cy="620" rx="360" ry="240" fill="url(#kh-glowF)"/>
  <ellipse cx="640" cy="440" rx="420" ry="170" fill="url(#kh-glowT)" opacity="0.6"/>

