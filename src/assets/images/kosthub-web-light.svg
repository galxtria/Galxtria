<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="kh-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#f6f4fd"/>
      <stop offset="1" stop-color="#e9e4f8"/>
    </linearGradient>
    <radialGradient id="kh-glowP" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#8b5cf6" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="kh-glowF" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e879f9" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#e879f9" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#e879f9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="kh-glowT" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.2"/>
      <stop offset="0.6" stop-color="#14b8a6" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kh-brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.55" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="kh-laser" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0"/>
      <stop offset="0.28" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#c084fc" stop-opacity="0.55"/>
      <stop offset="0.8" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="kh-imgA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#147a70"/>
      <stop offset="1" stop-color="#0b3b38"/>
    </linearGradient>
    <linearGradient id="kh-imgB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9ddc2"/>
      <stop offset="1" stop-color="#a8895a"/>
    </linearGradient>
    <linearGradient id="kh-imgC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b45309"/>
      <stop offset="1" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="kh-avatar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9a8d4"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <pattern id="kh-grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#7c6bb0" opacity="0.14"/>
    </pattern>
    <filter id="kh-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="22" stdDeviation="30" flood-color="#4c1d95" flood-opacity="0.22"/>
    </filter>
    <filter id="kh-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#4c1d95" flood-opacity="0.2"/>
    </filter>
    <filter id="kh-blur18" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

